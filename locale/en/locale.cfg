[controls]
platform-groups-toggle=Toggle platform groups panel

[platform-groups]
title=Platform groups
ungrouped=Ungrouped
no-platforms=No space platforms.

send-tooltip=Send every platform in this group to a location
sent=Sent __1__ platform(s) to __2__.
interrupt-tooltip=Pick an interrupt to activate on every platform in this group
interrupts-title=Interrupts
no-interrupts=No platform in this group has interrupts.
activated=Activated interrupt "__1__" on __2__ platform(s).
copy-tooltip=Load the build, requests and schedule of the first platform in this group. Click again to apply them to the others.
copy-apply-tooltip=Build loaded. Click to apply it to the other platforms in this group (adds ghosts, clears empty spots, replaces requests and schedule). Right-click to cancel. Dropped after one minute or when the panel closes.
copy-loaded=Loaded the build of __1__. Click the blueprint button to apply it to __2__ platform(s), right-click to cancel, or wait: it is dropped after one minute or when the panel closes.
copy-cancelled=Cancelled the loaded build of __1__.
copy-failed=Could not capture the build of __1__.
copied=Copied the build of __1__ to __2__ platform(s); placed __3__ ghost(s).
interrupts-mismatch=Interrupts on __1__ do not match the first platform after copying.
cancel-stops=Cancel active interrupts
cancel-stops-tooltip=Remove the temporary stops (from activated interrupts or the planet picker) from every platform in this group
cancelled-stops=Removed __1__ temporary stop(s).
launch-tooltip=Launch a new platform into this group at the chosen planet. It gets the first platform's build, requests and schedule once its hub is built.
launched=Launched __1__ at __2__. It is configured once the starter pack arrives and the hub is built.
launch-failed=Could not launch a platform (no starter pack item, or the planet does not allow it).
